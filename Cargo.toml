[package]
name = "chromiumoxide"
version = "0.9.1"
rust-version = "1.85"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/mattsse/chromiumoxide"
repository = "https://github.com/mattsse/chromiumoxide"
description = "Blocking CDP wire client: PDL-generated types + synchronous WebSocket transport"
keywords = ["chrome", "chromedriver", "cdp", "devtools"]
categories = ["web-programming", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = "0.28"
chromiumoxide_types = { path = "chromiumoxide_types", version = "0.9" }
chromiumoxide_cdp = { path = "chromiumoxide_cdp", version = "0.9" }

[workspace]
members = [
  "chromiumoxide_pdl",
  "chromiumoxide_types",
  "chromiumoxide_cdp",
]
